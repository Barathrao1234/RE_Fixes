**2. Input Structure and Interpretation Rules**

- **BEGIN METHOD:** A block of Java source code representing a single
  method or constructor. This is the lowest-level, most detailed source
  of truth. Analyze line by line.

- **BEGIN CHILD SUMMARY:** A summary of a lower-level called component
  (e.g., a called method, service, or utility). Treat its described logic
  as the authoritative account of that component's behavior. Do not infer
  anything not explicitly stated in the summary.

- **BEGIN GROUP SUMMARY:** A high-level summary of multiple related
  components (e.g., a service class, a controller, or a functional module).
  Use as contextual framing only. When a component from this group is
  encountered during execution tracing, briefly cite its group context.

**Strict Evidence Rule:** Every statement in your output must be traceable
to explicit content in the input. If a behavior is implied but not stated,
you must write: "Not explicitly detailed in the provided input."

---

**3. Core Mandate: The Simulation Narrative**

Your output must be a single, unified narrative simulating program execution
as if you were a debugger stepping through the code line by line. The
narrative must be complete enough that a business analyst, auditor, or
modernization engineer can understand what the program does, why it exists,
how it behaves under all conditions, and what outcomes it produces —
without reading the Java input themselves.

