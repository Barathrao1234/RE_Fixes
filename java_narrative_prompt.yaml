**6. Business Details Section (REQUIRED — Produced First)**

This section must appear first in your output, before the technical narrative.
It must be derived strictly from the analyzed logic.

**6A. Chunk Identity**

The chunk name will be provided in the input in the form: C001_mainline
The chunk ID is derived from this name as the prefix only: C001

This chunk ID is used to assign IDs to all business rules in this chunk
and must be carried forward into all consolidated outputs at higher levels.

**6B. Business Rule Identification**

Every business rule extracted from this chunk must be assigned a unique ID
using the following format:

  rule_id: <ChunkID>_BR<n>

Where <ChunkID> is derived from the chunk name (e.g., C001 from C001_mainline)
and <n> is a sequential integer starting from 1.

Examples:
  C001_BR1 — first business rule from chunk C001_mainline
  C001_BR2 — second business rule from chunk C001_mainline

The rule_id field must appear on every business rule entry without exception.

**6C. Business Rule Purity Mandate**

A business rule describes a real-world policy, constraint, or decision that
the organization enforces — expressed entirely in business language.

A business rule MUST NOT contain:
- Variable names, parameter names, method names, class names, or any
  Java identifier
- Technical terms such as: exception, null check, try-catch, throw,
  method call, flag, indicator, loop, stream, JSON, query, HTTP call,
  REST, callable statement
- Implementation details of any kind
- References to how the rule is implemented in code

A business rule MUST:
- Describe a real-world condition in plain business language
  (e.g., "user identity", "device registration status", "account balance")
- State the business outcome or policy consequence
  (e.g., "the request is rejected", "a notification is sent",
  "the record is placed on hold")
- Be understandable to a business stakeholder with no technical background

BUSINESS RULE TEST — Before writing any rule, apply this test:
  "Could a business manager, with no knowledge of Java or programming,
   read this rule and immediately understand the business policy it describes?"
  If NO → rewrite it until the answer is YES.
  If it cannot be expressed without technical terms → mark it:
  "Not expressible as a pure business rule from available input —
   requires business context to complete."

**6D. Business Details Consolidation Rules (FOR CHILD SUMMARY AND GROUP
SUMMARY INPUTS ONLY)**

When the input contains BEGIN CHILD SUMMARY or BEGIN GROUP SUMMARY blocks,
those blocks already contain Business Details sections produced by earlier
passes of this prompt. Consolidate all child Business Details sections into
a single unified Business Details section for the current chunk.

RULE CD-1 — business_functional_name Consolidation:
Derive one new business_functional_name for the consolidated chunk.
The name must be three to six words, Title Case, no technical terms.

RULE CD-2 — core_business_functionality Consolidation:
Produce two new sentences summarizing the combined capability.
Do not concatenate child summaries. Write a fresh synthesis.

RULE CD-3 — business_function Consolidation:
Collect every business function sentence from all child sections.
Deduplicate equivalent functions. Output as one sentence per line.

RULE CD-4 — business_functions_list Consolidation:
Collect all entries from child lists. Deduplicate. Each entry two to
three words. No technical verbs. No articles.

RULE CD-5 — business_rules Consolidation (CRITICAL):

  STEP 1: Collect all child rules with their rule_ids.

  STEP 2: For each rule, decide:
    DECISION A — Carry Forward: unique rule, keep as-is, same rule_id.
    DECISION B — Merge: same policy from multiple chunks, write one
      consolidated rule, new rule_id from current chunk, occurrence field
      lists all merged source IDs separated by underscores.
    DECISION C — Split: one child rule contains multiple distinct policies,
      split into atomic rules, new rule_ids, occurrence field cites source.

RULE CD-6 — No Silent Dropping:
Every child rule must appear in the output under exactly one decision.
Deprecated rules must appear with occurrence: "Deprecated" and justification.

RULE CD-7 — New Rules from Group Narrative:
New rules found in GROUP SUMMARY must be added with source_chunks:
["GROUP_SUMMARY"].

