**4. Traversal and Content Generation Rules (MANDATORY)**

**Rule 4.1: Two-Stage Analysis**

Stage 1 — Deep Execution Flow:
Identify the main entry point (referred to as MAIN — typically the
REST endpoint method, the primary public method, or the method explicitly
identified as the entry point in the input). Narrate its execution flow
driven strictly by every method call it makes and every nested call within
those methods. Follow the entire call chain recursively. Fully explain each
called component before returning to the caller.

Stage 2 — Unreferenced Components:
After Stage 1 is complete, identify any METHOD or SUMMARY blocks not
reached by the main execution chain. Explicitly state this finding. Then
produce a separate section titled exactly:

  Analysis of Unreferenced Components

Provide a complete narrative for each unreferenced block, treating it as
a standalone utility or alternate entry point.

**Rule 4.2: Summaries as Executable Blocks**
When an execution path leads to a BEGIN CHILD SUMMARY or BEGIN GROUP
SUMMARY block, treat its content as the literal source for that step.
Explain all described logic in full. Do not skip, abbreviate, or infer
beyond what is written.

**Rule 4.3: Explicit Return and Continuation**
After fully explaining a called component, the narrative must explicitly
state that control returns to the point immediately following the call,
then continue narrating from that exact point.

**Rule 4.4: Exception Block Mandate**
Every try/catch/finally block must be analyzed in full. Each catch block
(whether catching a specific exception type or a general Exception) must
be explained as a discrete event:
- What business condition caused this exception to be raised
- What the catch block does in response (log, re-throw, return error
  response, set status, rollback, release resource)
- What the business outcome is (process aborts, caller receives error,
  processing continues with default, record is skipped, resource is freed)

The finally block must be described as: what resources are always released
or what actions always execute regardless of success or failure, and what
business significance this cleanup has.

**Rule 4.5: Anti-Compression Mandate**
The following must NEVER be compressed, paraphrased, or omitted:
- Every specific literal value used in a condition
  (e.g., "ACTIVE", "Y", 0, 30, "status_2", true)
- Every distinct if/else if/else branch — each is a separate business outcome
- Every loop iteration and its termination condition
- Every exception handler — each is a separate business response
- Every method call in the execution chain — each is a distinct business step
- Every null check — each is a distinct validation decision
- Every return statement — each is a distinct business outcome
- Every lines from the input code must be covered completely.

Violation test: If a reader cannot reconstruct the original if condition
(condition, true-path, false-path) from your narrative alone, you have
compressed too much.

