**1. Java Code Structure — Reference for Analysis**

Java code is organized into classes and methods. Your analysis must recognize
this fundamental structure. Use the following as an analytical lens, not as
background information:

- **Class-level declarations:** Fields, constants, injected dependencies,
  and class-level variables declared at the top of a class. Every field
  must be noted and its business purpose stated.

- **Method signature:** The method name, access modifier, return type, and
  parameter list. Every parameter is a business input and must be named
  and described exactly as declared.

- **Method body — local declarations:** Local variables, collections, and
  objects declared within the method before use. Every declaration must be
  noted and its business purpose stated.

- **Method body — executable logic:** The main business logic including
  conditional statements, loops, method calls, object construction,
  assignments, and return statements.

- **Exception handling blocks (try / catch / finally):** Each catch block
  is a discrete business decision and must be explained individually.
  The finally block represents cleanup logic that always executes regardless
  of outcome and must be described explicitly.

These represent the key elements to be covered; any additional relevant aspects should 
also be identified and included to ensure completeness.

**Mandatory Java Construct Coverage:**

You must explicitly identify and narrate every occurrence of the following
constructs. Each one carries business significance and must never be
collapsed into a generic statement:

- **Method parameters and local variables:** State the exact name, type,
  and business purpose of every parameter and local variable declared.
  For collections and objects, state what business data they hold.

- **if / else if / else chains:** Each branch is an independent business
  decision. Describe every branch — both true and false paths —
  individually. Never merge branches into one statement.

- **switch / switch expressions:** Each case is a discrete business rule.
  Describe every case and its outcome, including the default case.

- **for loops / enhanced for loops / while loops / do-while loops:**
  For every loop, state what business entity is being iterated, what
  processing occurs per iteration, and what condition terminates the loop.

- **Stream operations / lambda expressions:** State what business data
  set is being processed, what filtering, mapping, or reduction is applied,
  and what business result is produced.

- **try / catch / finally blocks:** For each catch block, state the
  exception type caught, what business condition caused it, what the
  handler does in response (log, re-throw, return default, set status),
  and what the business outcome is (process aborts, caller is notified,
  processing continues with default, record is skipped). The finally block
  must be described as the unconditional cleanup or resource release step.

- **Method calls to other methods (internal and external):**
  Distinguish between:
  — Internal method calls (calls to methods within the same class or
    inherited methods): describe the business purpose of the call and
    what it returns.
  — External method calls (calls to injected services, utility classes,
    or third-party libraries): describe the business service being invoked,
    what business input is passed, and what business result is returned.
  — Backend procedure calls (calls to database stored procedures via
    CallableStatement, JPA, or ORM): these are integration touchpoints and
    must be documented with the exact procedure name, all parameters passed,
    and all output parameters received.

- **Object construction (new):** State what business entity is being
  created, what data it is initialized with, and what it represents.

- **JSON parsing and construction:** State what business data structure
  is being read or built, what fields are extracted or populated, and
  what the result represents in business terms.

- **File handling operations:** State what type of document or file is
  being read, written, or processed, and what business purpose it serves.

- **HTTP calls / REST client invocations:** State the endpoint being
  called in business terms, what data is sent, what response is expected,
  and how different response codes are handled.

- **return statements:** State exactly what business value or result is
  returned and what it signifies to the caller.

- **throw statements:** State the exact exception thrown, the business
  condition that triggered it, and what business outcome results.

- **Null checks and defensive guards:** State what business field is
  being checked, what constitutes a valid vs. absent value, and what
  happens in each case.

- **String manipulation and data transformation:** For every value that
  is trimmed, parsed, converted, formatted, or transformed, state what
  the original value represents, what transformation is applied, and
  what the result means in business terms.

- **Constants and hardcoded literal values:** Every literal string, number,
  or boolean used in a condition or assignment carries business meaning.
  State exactly what business policy or threshold it represents.

