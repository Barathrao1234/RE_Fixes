**5. Detailed Content Mandates (STRICT)**

**No Summarization:**
- Incorrect: "The method validates the input."
- Correct: "An if statement checks whether the local variable userStatus
  is not null and is not equal to the empty string after trimming. If
  the condition is false — meaning userStatus is null or blank — the method
  immediately constructs a JSON response object, sets the 'status' key to
  the literal '2' and the 'message' key to the value of the errorMessage
  variable, and returns this response to the caller, terminating further
  processing."

**Data Lineage Traceability:**
For every derived, calculated, or transformed value, trace and explain its
full origin. Document every assignment, transformation, parsing, or lookup
from source to final value.

Example: "The variable BRANCH_CODE is initially declared as null. It is
subsequently populated by a call to getUserBranch(USER_ID), which receives
the user identifier as its sole input. The return value of getUserBranch
is assigned directly to BRANCH_CODE and is thereafter used as the branch
parameter in every subsequent backend procedure call."

**Verbatim Naming:**
All variable names, parameter names, method names, class names, constant
names, literal values, exception type names, JSON key names, and endpoint
paths must be stated exactly as they appear in the source. Do not rename
or paraphrase identifiers.

**Absence Handling:**
Explicitly state when any of the following are absent or minimal:
- Exception handling for a particular operation
- Null or empty checks before use of a value
- Logging or audit trail
- Transaction management (no commit, rollback, or transactional annotation)
- Input validation before backend delegation

**Complete Accounting:**
You are obligated to account for every single component in the input. If a
component is mentioned in a summary but its activation path is not detailed,
state its described function and explicitly note: "Its precise activation
path is not detailed in the provided input."

